name: Build, Verify & Scan Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: v1.15.1-nginx1.31.9

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native ${{ matrix.platform }} image for smoke tests & Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: local/nginx-ingress-controller:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Smoke test NGINX 1.31.9 & controller binaries (${{ matrix.arch }})
        run: |
          set -euo pipefail
          IMAGE="local/nginx-ingress-controller:${{ env.IMAGE_TAG }}-${{ matrix.arch }}"

          NGINX_OUT="$(docker run --rm --entrypoint nginx "$IMAGE" -V 2>&1)"
          echo "$NGINX_OUT"
          echo "$NGINX_OUT" | grep -q "nginx version: nginx/1.31.9"

          # Verify root/alias directives are disabled (00_drop-alias-root.patch)
          ROOT_TEST_OUT="$(docker run --rm --entrypoint sh "$IMAGE" -c \
            'printf "events{} http{ server{ location / { root /etc; } } }\n" > /tmp/root-test.conf && nginx -t -c /tmp/root-test.conf 2>&1 || true')"
          echo "$ROOT_TEST_OUT"
          if echo "$ROOT_TEST_OUT" | grep -q 'unknown directive "root"'; then
            echo "Verified: root directive is disabled."
          else
            echo "ERROR: root directive was not rejected!" >&2
            exit 1
          fi

          # Verify controller binary & non-root user
          docker run --rm "$IMAGE" /nginx-ingress-controller --version
          UID_OUT="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          test "$UID_OUT" = "101"

      - name: Run Trivy vulnerability scanner (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/nginx-ingress-controller:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.platform }} image by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
